[project]
name = "boilerplate"
version = "0.1.0"
description = "Django 6.x boilerplate"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Core Django & REST Framework
    "django>=6.1.2,<7.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.0",
    "drf-nested-routers>=0.94.1",
    "drf-yasg>=1.21.10",
    "drf-gears>=0.10.7",

    # Database & ORM helpers
    "psycopg[binary]>=3.2.0",
    "dj-database-url>=2.3.0",
    "django-filter>=25.1",
    "django-extensions>=4.1",
    "django-soft-delete>=1.0.18",
    "django-admin-sortable2>=2.2.8",
    "django-json-widget>=2.0.1",

    # Security & Utilities
    "django-cors-headers>=4.7.0",
    "python-dotenv>=1.1.0",
    "orjson>=3.10.16",
    "pillow>=11.2.1",

    # Storage & Cache
    "django-redis>=5.4.0",

    # UI Theme
    "django-jazzmin>=3.0.1",
]

[dependency-groups]
development = [
    "pytest>=8.3.5",
    "pytest-django>=4.11.1",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "factory-boy>=3.3.3",
    "pytest-factoryboy>=2.7.0",
    "faker>=37.1.0",
    "ipython>=9.1.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "flake8>=7.2.0",
    "mypy>=1.15.0",
    "django-stubs>=5.1.3",
    "pylint-django>=2.6.1",
]
staging = [
    "gunicorn>=23.0.0",
]
production = [
    "gunicorn>=23.0.0",
]

# Code Formatting Configuration
[tool.black]
line-length = 88
target-version = ["py314"]
exclude = '''
/(
    \.git
  | \.venv
  | migrations
)/
'''

# Sorting Configuration
[tool.isort]
profile = "black"
line_length = 88
indent = 4
atomic = true
lines_after_imports = 2
force_single_line = true
default_section = "THIRDPARTY"
known_first_party = ["apps"]
known_django = ["django"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*/migrations/*.py", "*/.venv/*"]
skip = ["migrations", "assets"]

# Static Type Checker Configuration
[tool.mypy]
python_version = "3.14"
platform = "linux"
warn_incomplete_stub = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.development"

[[tool.mypy.overrides]]
module = [
    "api.migrations.*",
    "apps.*.migrations.*",
    "libraries.*",
    "config.settings.*",
]
ignore_errors = true

# Testing Configuration
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--disable-warnings --maxfail=1 --migrations --create-db"
junit_family = "xunit1"
filterwarnings = [
    "ignore:.*received a naive.*while time zone support is active.*:RuntimeWarning:django.db.models.fields",
    "ignore::django.utils.deprecation.RemovedInDjango40Warning",
]
markers = [
    "race_condition: test race condition in concurrent API requests.",
    "override_settings: does the same as `django.test.override_settings` but in pytest way.",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "refactor: marks tests for refactoring",
]

# Coverage Configuration
[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/factories.py",
    "*/**/factories.py",
    "*/migrations/*",
    ".venv/*",
    "*/settings/*",
    "manage.py",
    "wsgi.py",
    "conftest.py",
    "docs/*",
    "middlewares.py",
    "exception_handlers.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "pass",
    "raise ImportError",
    "if __name__ == .__main__.:",
]